<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile</title>

{% include 'smartfit_app/common_html/common_css.html'%}

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    padding:0;
    font-family:'Poppins',sans-serif;
    background:#0b1220;
}

/* Main Background */
.main{
    min-height:100vh;
    padding:60px 20px;
    background:
    linear-gradient(rgba(11,18,32,.84),rgba(11,18,32,.92)),
    url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438") no-repeat center center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Card */
.container-box{
    width:100%;
    max-width:520px;
    padding:38px;
    border-radius:24px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(0,194,255,0.14);
    backdrop-filter:blur(12px);
    box-shadow:0 20px 40px rgba(0,0,0,.35);
}

/* Title */
.page-title{
    text-align:center;
    color:#00c2ff;
    font-size:34px;
    font-weight:700;
    margin-bottom:24px;
}

/* Image */
.profile-img{
    text-align:center;
    margin-bottom:22px;
}

.profile-img img{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid rgba(0,194,255,0.35);
    box-shadow:0 10px 24px rgba(0,0,0,.35);
}

/* Labels */
label{
    display:block;
    margin-bottom:8px;
    margin-top:14px;
    color:#e2e8f0;
    font-size:14px;
    font-weight:500;
}

/* Inputs */
input,
textarea{
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.03);
    color:white;
    font-size:15px;
    outline:none;
    transition:.3s;
}

input::placeholder,
textarea::placeholder{
    color:#94a3b8;
}

input:focus,
textarea:focus{
    border-color:#00c2ff;
    box-shadow:0 0 0 4px rgba(0,194,255,.08);
}

input[readonly]{
    opacity:.75;
    cursor:not-allowed;
}

/* Button */
.btn-update{
    width:100%;
    border:none;
    padding:14px;
    margin-top:24px;
    border-radius:14px;
    background:linear-gradient(135deg,#00c2ff,#3b82f6);
    color:white;
    font-size:16px;
    font-weight:600;
    transition:.3s;
}

.btn-update:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 28px rgba(59,130,246,.25);
}

/* Alert */
.alert{
    border-radius:14px;
}

/* Responsive */
@media(max-width:576px){
    .container-box{
        padding:26px 18px;
    }

    .page-title{
        font-size:28px;
    }
}
</style>
</head>

<body>

{% include 'smartfit_app/member/member_header.html'%}

{% if messages %}
{% for msg in messages %}
<div class="alert alert-danger alert-dismissible fade show w-50 mx-auto text-center mt-4" role="alert">
<strong>{{ msg }}</strong>
<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endfor %}
{% endif %}

<div class="main">

<div class="container-box">

    <h2 class="page-title">Edit Profile</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="profile-img">
            <img src="{{ member.profile_pic.url }}" alt="Profile Image">
        </div>

        <label>Username</label>
        <input type="text" name="name" value="{{ member.name }}">

        <label>Email</label>
        <input type="email" name="email" readonly value="{{ member.email }}">

        <label>Phone</label>
        <input type="text" name="phone" value="{{ member.phone }}">

        <label>Address</label>
        <textarea name="address" rows="4">{{ member.address }}</textarea>

        <label>Change Profile Picture</label>
        <input type="file" name="profile_pic">

        <button type="submit" class="btn-update">Update Profile</button>

    </form>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
