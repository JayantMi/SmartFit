{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    {% include 'smartfit_app/common_html/common_css.html'%}

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    padding:0;
    font-family:'Poppins',sans-serif;
    background:#0b1220;
}

/* Main Background */
.main{
    min-height:100vh;
    background:
    linear-gradient(rgba(11,18,32,.84),rgba(11,18,32,.90)),
    url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438") no-repeat center center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:60px 20px;
}

/* Contact Box */
.box{
    width:100%;
    max-width:560px;
    padding:40px;
    border-radius:24px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(0,194,255,0.14);
    backdrop-filter:blur(12px);
    box-shadow:0 20px 40px rgba(0,0,0,.35);
}

/* Heading */
.title{
    text-align:center;
    color:#00c2ff;
    font-size:34px;
    font-weight:700;
    margin-bottom:8px;
}

.sub-title{
    text-align:center;
    color:#cbd5e1;
    font-size:14px;
    margin-bottom:30px;
}

/* Inputs */
.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#e2e8f0;
    font-size:14px;
    font-weight:500;
}

input, textarea{
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.03);
    color:white;
    font-size:15px;
    outline:none;
    transition:.3s;
}

input::placeholder,
textarea::placeholder{
    color:#94a3b8;
}

input:focus,
textarea:focus{
    border-color:#00c2ff;
    box-shadow:0 0 0 4px rgba(0,194,255,.08);
}

/* Button */
.btn-submit{
    width:100%;
    border:none;
    padding:14px;
    border-radius:14px;
    background:linear-gradient(135deg,#00c2ff,#3b82f6);
    color:white;
    font-weight:600;
    font-size:16px;
    transition:.3s;
}

.btn-submit:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 24px rgba(59,130,246,.25);
}

/* Responsive */
@media(max-width:576px){
    .box{
        padding:28px 20px;
    }

    .title{
        font-size:28px;
    }
}
</style>
</head>

<body>

{% include 'smartfit_app/common_html/navbar.html'%}

<div class="main">

    <div class="box">

        <h1 class="title">Contact Us</h1>
        <p class="sub-title">We’d love to hear from you. Send your query anytime.</p>

        <form method="post" action="/contact/">
            {% csrf_token %}

            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter phone number">
            </div>

            <div class="input-group">
                <label for="query">Query</label>
                <textarea id="query" name="query" rows="5" placeholder="How can we help?"></textarea>
            </div>

            <button type="submit" class="btn-submit">Submit</button>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
