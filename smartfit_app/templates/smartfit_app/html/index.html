{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFit Home</title>

    {% include 'smartfit_app/common_html/common_css.html'%}

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
body{
    font-family:'Poppins',sans-serif;
    margin:0;
    padding:0;
    background:#0b1220;
}

/* Hero */
.hero{
    height:100vh;
    background:
    linear-gradient(rgba(11,18,32,.78),rgba(11,18,32,.85)),
    url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48") no-repeat center center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.hero-content{
    max-width:720px;
    color:white;
    animation:fadeIn 1.2s ease;
}

.hero-content h1{
    font-size:54px;
    font-weight:700;
    color:#00c2ff;
}

.hero-content p{
    font-size:18px;
    color:#cbd5e1;
    margin-top:14px;
}

/* Buttons */
.btn-custom{
    padding:12px 30px;
    border-radius:30px;
    font-weight:600;
    transition:.3s;
}

.btn-primary{
    background:linear-gradient(135deg,#00c2ff,#3b82f6);
    border:none;
}

.btn-primary:hover{
    transform:translateY(-2px);
}

.btn-outline-light{
    border:1px solid #00c2ff;
    color:#00c2ff;
}

.btn-outline-light:hover{
    background:#00c2ff;
    color:#0b1220;
}

/* Animation */
@keyframes fadeIn{
from{opacity:0;transform:translateY(30px);}
to{opacity:1;transform:translateY(0);}
}

/* Mobile */
@media(max-width:768px){
.hero-content h1{font-size:34px;}
.hero-content p{font-size:16px;}
}
</style>
</head>

<body>

{% include 'smartfit_app/common_html/navbar.html'%}

<!-- 🔥 Hero Section -->
<div class="hero">

    <div class="hero-content">
        <h1>Welcome to SmartFit</h1>

        <p>
            Transform your body with AI-powered workouts, smart nutrition, and expert guidance 💪
        </p>

        <div class="mt-4">
            <a href="/member_login" class="btn btn-primary btn-custom me-2">Join Now</a>
            <a href="/view_workout/" class="btn btn-outline-light btn-custom">Explore Programs</a>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
