<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Trainer Profile - SmartFit</title>

{% include 'smartfit_app/common_html/common_css.html'%}

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    padding:0;
    font-family:'Poppins',sans-serif;
    background:#0b1220;
    color:white;
}

/* Main Background */
.main{
    min-height:100vh;
    padding:70px 20px;
    background:
    linear-gradient(rgba(11,18,32,.84),rgba(11,18,32,.92)),
    url("https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b") no-repeat center center/cover;
    background-size:cover;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Card */
.container1{
    width:100%;
    max-width:500px;
    padding:42px;
    border-radius:28px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(0,194,255,0.14);
    backdrop-filter:blur(12px);
    box-shadow:0 20px 45px rgba(0,0,0,.35);
}

/* Title */
.page-title{
    text-align:center;
    color:#00c2ff;
    font-size:34px;
    font-weight:700;
    margin-bottom:24px;
}

/* Profile Image */
.profile-img{
    text-align:center;
    margin-bottom:24px;
}

.profile-img img{
    width:110px;
    height:110px;
    object-fit:cover;
    border-radius:50%;
    border:4px solid rgba(0,194,255,.35);
    box-shadow:0 10px 25px rgba(0,0,0,.35);
}

/* Labels */
label{
    display:block;
    margin-top:14px;
    margin-bottom:8px;
    color:#e2e8f0;
    font-size:14px;
    font-weight:500;
}

/* Inputs */
input,
textarea{
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.03);
    color:white;
    font-size:15px;
    outline:none;
    transition:.3s;
}

input:focus,
textarea:focus{
    border-color:#00c2ff;
    box-shadow:0 0 0 4px rgba(0,194,255,.08);
}

textarea{
    resize:vertical;
    min-height:90px;
}

/* Button */
.button{
    width:100%;
    padding:15px;
    margin-top:24px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#00c2ff,#3b82f6);
    color:white;
    font-size:16px;
    font-weight:600;
    transition:.3s;
}

.button:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 28px rgba(59,130,246,.25);
}

/* Responsive */
@media(max-width:576px){
    .container1{
        padding:28px 20px;
    }

    .page-title{
        font-size:28px;
    }
}
</style>
</head>

<body>

{% include 'smartfit_app/trainer/trainer_header.html'%}

<div class="main">

<div class="container1">

<h2 class="page-title">Edit Profile</h2>

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<div class="profile-img">
<img src="{{ trainer.profile_pic.url }}" alt="Profile Image">
</div>

<label>Username</label>
<input type="text" name="name" value="{{ trainer.name }}">

<label>Email</label>
<input type="email" name="email" readonly value="{{ trainer.email }}">

<label>Phone</label>
<input type="text" name="phone" value="{{ trainer.phone }}">

<label>City</label>
<textarea name="city">{{ trainer.city }}</textarea>

<label>Change Profile Picture</label>
<input type="file" name="profile_pic">

<button type="submit" class="button">
Update Profile
</button>

</form>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
